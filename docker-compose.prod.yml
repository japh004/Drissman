# ============================================================================
#  Drissman backend — déploiement sur l'infra yowyob (voir .gitlab-ci.yml)
#  Secrets : fichier .env déposé MANUELLEMENT dans /home/gi/drissman
#  (jamais commité — voir .env.example pour la liste des variables).
# ============================================================================
services:

  drissman-backend:
    image: "${APP_IMAGE:?APP_IMAGE requis - construit par le CI}"
    container_name: drissman-backend
    pull_policy: never
    restart: unless-stopped
    env_file: [.env]
    build:
      context: ./backend
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: "prod"
      # --- PostgreSQL : base dédiée (créée par l'admin de l'infra) ---
      SPRING_R2DBC_URL: "r2dbc:postgresql://database:5432/drissman"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://database:5432/drissman"
      SPRING_LIQUIBASE_URL: "jdbc:postgresql://database:5432/drissman"
      # Exclut les changesets de seed tagués context:dev (données de démo).
      LIQUIBASE_CONTEXTS: "prod"
      DB_USERNAME: "${DB_USERNAME:?requis dans .env}"
      DB_PASSWORD: "${DB_PASSWORD:?requis dans .env}"
      # --- kernel-core (réseau interne yowyob) ---
      KERNEL_BASE_URL: "http://kernel-core-kernel-layer-1:8080"
      KERNEL_CLIENT_ID: "${KERNEL_CLIENT_ID:?requis dans .env}"
      KERNEL_API_KEY: "${KERNEL_API_KEY:?requis dans .env}"
      KERNEL_TENANT_ID: "${KERNEL_TENANT_ID:?requis dans .env}"
      # Payment Core kernel : URL publique notifiée par le kernel (statut final).
      KERNEL_PAYMENT_CALLBACK_URL: "https://drisman.yowyob.com/drisman-api/api/payments/webhook"
      # --- Secrets applicatifs ---
      JWT_SECRET: "${JWT_SECRET:?requis dans .env}"
      SUPERADMIN_SECRET: "${SUPERADMIN_SECRET:?requis dans .env}"
      # --- Yowyob Payment (paiement carte) ---
      PAYMENT_EMAIL: "${PAYMENT_EMAIL:-}"
      PAYMENT_PASSWORD: "${PAYMENT_PASSWORD:-}"
      PAYMENT_WALLET_ID: "${PAYMENT_WALLET_ID:-}"
      # --- CORS (frontend Vercel + domaine yowyob) ---
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS:-https://drissman0.vercel.app}"
      # --- Derrière Traefik en path-routing ---
      SERVER_FORWARD_HEADERS_STRATEGY: "framework"
      # --- Uploads d'images (dossier inscriptible, persiste via volume) ---
      APP_UPLOAD_DIR: "/app/uploads/images"
    volumes:
      - drissman_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s
    labels:
      - "traefik.enable=true"
      # Un domaine, backend sous /drissman-api (option B recommandée)
      - "traefik.http.routers.drissman.rule=Host(`drissman.yowyob.com`) && PathPrefix(`/drissman-api`)"
      - "traefik.http.routers.drissman.entrypoints=websecure"
      - "traefik.http.routers.drissman.tls=true"
      - "traefik.http.routers.drissman.tls.certresolver=letsencrypt"
      - "traefik.http.routers.drissman.priority=100"
      - "traefik.http.middlewares.drissman-strip.stripprefix.prefixes=/drissman-api"
      - "traefik.http.routers.drissman.middlewares=drissman-strip"
      - "traefik.http.services.drissman.loadbalancer.server.port=8080"
      - "traefik.docker.network=yowyob"
    networks:
      - yowyob

volumes:
  drissman_uploads:

networks:
  # Réseau partagé EXISTANT du serveur (Traefik / Postgres / Kafka / kernel-core).
  yowyob:
    external: true
    name: yowyob
