# ============================================================================
#  CI de contrôle des Pull Requests (GitHub Actions).
#  Ne déploie RIEN : le déploiement passe par le pipeline GitLab (push sur main).
#  Barrières bloquantes : tests backend, type-check + tests + build frontend.
#  Le lint frontend est signalé mais non bloquant tant que la dette existante
#  (84 erreurs au 2026-11-12) n'est pas résorbée — voir docs/ROADMAP.md.
# ============================================================================
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests unitaires
        run: mvn -B -ntp test

  frontend:
    name: Frontend — types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit -p .
      - name: Tests unitaires
        run: npm test
      - name: Build de production
        env:
          NEXT_PUBLIC_API_URL: https://drisman.yowyob.com/drissman-api
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Lint (non bloquant)
        continue-on-error: true
        run: npm run lint
